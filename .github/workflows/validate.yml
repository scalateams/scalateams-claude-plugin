name: Validate plugin

# Runs on every PR (not path-filtered) because `validate` is a required status
# check on `main` — a path filter would leave PRs that don't touch those paths
# waiting forever on a check that never reports.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate plugin and agents
        run: claude plugin validate ./scalateams
